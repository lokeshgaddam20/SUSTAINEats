# .github/workflows/cicd.yml
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: docker.io

jobs:
  # Quick health check
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check Dockerfiles exist
      run: |
        if [ ! -f "backend/Dockerfile" ] || [ ! -f "frontend/Dockerfile" ]; then
          echo "❌ Dockerfiles missing"
          exit 1
        fi
        echo "✅ Dockerfiles exist"

  # Build and Push Docker Images
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: health-check
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [backend, frontend]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.service }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Success notification
  notify:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: success()
    
    steps:
    - name: Success message
      run: |
        echo "✅ Images pushed successfully to Docker Hub!"
        echo "Backend: ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest"
        echo "Frontend: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest"